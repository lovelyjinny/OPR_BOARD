  async function open(key){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct); const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close(); }
  async function tryKey(p){ b.disabled = true; e.textContent = '여는 중…';
    try { const key = await derive(p); await open(key); try { sessionStorage.setItem('emoney_k', JSON.stringify(Array.from(new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch(x){} }
    catch(x){ e.textContent = '비밀번호가 맞지 않습니다.'; b.disabled = false; pw.select(); } }
  f.addEventListener('submit', ev=>{ ev.preventDefault(); if (pw.value) tryKey(pw.value); });
  (async()=>{ try { const raw = sessionStorage.getItem('emoney_k'); if (!raw) return; const key = await crypto.subtle.importKey('raw', new Uint8Array(JSON.parse(raw)), 'AES-GCM', false, ['decrypt']); await open(key); } catch(x){ try{sessionStorage.removeItem('emoney_k');}catch(y){} } })();
})();
</script></body></html>
